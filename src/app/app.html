<div class="flex min-h-dvh flex-col bg-base-100 font-sans text-base-content selection:bg-primary selection:text-primary-content">
  <button class="btn btn-primary fixed start-3 top-3 z-10 -translate-y-[160%] focus:translate-y-0"
          (click)="content.focus(); content.scrollIntoView()">跳到主要內容</button>
  <header #pageTop class="border-b border-base-300">
    <nav class="navbar mx-auto min-h-17 w-[90%] max-w-320 justify-between px-0 sm:min-h-20" aria-label="主導覽">
      <a routerLink="/" aria-label="Eddie 作品集首頁" class="flex min-h-11 items-center gap-3 rounded-xs">
        <img src="assets/mark.svg" alt="" width="31" height="31">
        <span lang="en" class="font-brand text-[1.55rem] leading-none font-bold tracking-tight">Eddie</span>
        <span aria-hidden="true" class="h-4 w-px bg-base-300"></span>
        <span class="text-sm font-medium text-secondary">作品集</span>
      </a>
      <a class="btn btn-ghost h-11 gap-2 rounded-full px-3 text-sm font-semibold text-primary"
         routerLink="/" fragment="works">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2" y="2" width="6" height="6" rx="1"/><rect x="12" y="2" width="6" height="6" rx="1"/>
          <rect x="2" y="12" width="6" height="6" rx="1"/><rect x="12" y="12" width="6" height="6" rx="1"/>
        </svg>
        所有作品
      </a>
    </nav>
  </header>
  <main #content tabindex="-1" class="mx-auto w-[90%] max-w-320 flex-1 outline-none">
    <router-outlet (activate)="content.focus({ preventScroll: true })" />
  </main>
  <footer class="footer mx-auto flex w-[90%] max-w-320 flex-wrap items-center justify-between gap-4 border-t border-base-300 py-5 text-secondary">
    <a routerLink="/" class="inline-flex min-h-11 items-center gap-2.5 text-sm font-medium" aria-label="Eddie 作品集首頁">
      <img width="20" height="20" src="assets/mark.svg" alt="">
      <span lang="en" class="font-brand font-semibold">Eddie</span><span aria-hidden="true">/</span>作品集
    </a>
    <button type="button" class="btn btn-ghost inline-flex min-h-11 items-center gap-2 px-2 text-xs font-medium"
            (click)="content.focus({ preventScroll: true }); pageTop.scrollIntoView()">
      回到頁首 <span aria-hidden="true">↑</span>
    </button>
  </footer>
</div>
